services:
  wordpress:
    build: .
    container_name: icgowa_wordpress
    restart: always
    ports:
      - "4000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: host.docker.internal:3306
      WORDPRESS_DB_USER: sql_icgowa
      WORDPRESS_DB_PASSWORD: 73HEMczxpLFrR4AY
      WORDPRESS_DB_NAME: sql_icgowa
      WORDPRESS_TABLE_PREFIX: wphv_
      WP_HOME: https://icgowa.sch.id
      WP_SITEURL: https://icgowa.sch.id
    entrypoint: ["sh", "-c", "chown -R www-data:www-data /var/www/html/wp-content/uploads && exec docker-entrypoint.sh apache2-foreground"]
    volumes:
      - ./wp-content/uploads:/var/www/html/wp-content/uploads

