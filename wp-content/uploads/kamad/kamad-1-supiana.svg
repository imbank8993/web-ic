<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="50%" stop-color="#143d66"/>
      <stop offset="100%" stop-color="#1d568a"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="avatarGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad1)"/>

  <!-- Decorative Islamic / Geometric Pattern Subtle Overlay -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Badge Top -->
  <g transform="translate(200, 42)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#fef3c7" letter-spacing="1">PERIODE 2018 – 2022</text>
  </g>

  <!-- Female Hijab Formal Avatar Silhouette -->
  <g filter="url(#shadow1)">
    <!-- Body / Blazer Formal -->
    <path d="M 120 400 C 120 330, 150 300, 200 300 C 250 300, 280 330, 280 400 Z" fill="url(#avatarGrad1)"/>
    <!-- Lapel / Collar Accent -->
    <path d="M 180 320 L 200 365 L 220 320" fill="none" stroke="#0a2540" stroke-width="4" stroke-linecap="round"/>
    <polygon points="200,345 192,375 208,375" fill="url(#goldGrad1)"/>

    <!-- Hijab Outline & Draping -->
    <path d="M 152 205 C 145 250, 160 295, 200 298 C 240 295, 255 250, 248 205 C 244 140, 156 140, 152 205 Z" fill="url(#avatarGrad1)"/>
    
    <!-- Face Oval Area -->
    <ellipse cx="200" cy="205" rx="34" ry="42" fill="#0a2540" fill-opacity="0.18"/>
  </g>

  <!-- Monogram Pill at Bottom Center -->
  <g transform="translate(200, 435)">
    <circle cx="0" cy="0" r="26" fill="url(#goldGrad1)" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow1)"/>
    <text text-anchor="middle" y="6" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#0f172a">HS</text>
  </g>

  <!-- Title Watermark -->
  <text x="200" y="482" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Foto Dummy • Hj. Supiana</text>
</svg>
