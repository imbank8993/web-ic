<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2447"/>
      <stop offset="50%" stop-color="#19376d"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad2)"/>

  <!-- Decorative Subtle Pattern Overlay -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="6,6"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Badge Top -->
  <g transform="translate(200, 42)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0b2447" fill-opacity="0.8" stroke="#60a5fa" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#dbeafe" letter-spacing="1">PLT. 2022 – 2023</text>
  </g>

  <!-- Male Formal Suit Avatar Silhouette -->
  <g filter="url(#shadow2)">
    <!-- Body / Suit Formal -->
    <path d="M 115 400 C 115 325, 145 295, 200 295 C 255 295, 285 325, 285 400 Z" fill="url(#avatarGrad2)"/>
    <!-- Suit V-Neck Collar & Tie -->
    <polygon points="182,295 200,345 218,295" fill="#0f172a"/>
    <polygon points="194,310 206,310 203,380 200,385 197,380" fill="url(#blueGrad2)"/>

    <!-- Head & Hair Formal -->
    <ellipse cx="200" cy="205" rx="42" ry="52" fill="url(#avatarGrad2)"/>
    <!-- Hair Short Pompadour Silhouette -->
    <path d="M 156 195 C 156 145, 175 138, 200 138 C 225 138, 244 145, 244 195 C 235 160, 165 160, 156 195 Z" fill="#0f172a" fill-opacity="0.35"/>
  </g>

  <!-- Monogram Pill at Bottom Center -->
  <g transform="translate(200, 435)">
    <circle cx="0" cy="0" r="26" fill="url(#blueGrad2)" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow2)"/>
    <text text-anchor="middle" y="6" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff">AM</text>
  </g>

  <!-- Title Watermark -->
  <text x="200" y="482" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#93c5fd" letter-spacing="0.5">Foto Dummy • Andri Adi Mustika</text>
</svg>
